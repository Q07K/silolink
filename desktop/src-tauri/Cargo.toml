[package]
name = "silolink-desktop"
version = "0.2.0"
edition = "2024"
rust-version = "1.90"
publish = false
default-run = "silolink-desktop"

[features]
custom-protocol = ["tauri/custom-protocol"]

[[bin]]
name = "silolink-desktop-provider-fixture"
path = "tests/support/provider.rs"
test = false

[lib]
name = "silolink_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
silolink = { path = "../.." }
dirs = "6"
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-dialog = "2"
tauri-plugin-notification = "2"
tauri-plugin-opener = "2"
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "process", "io-util", "sync", "time", "macros"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
uuid = { version = "1", features = ["v4"] }
url = "2"
reqwest = { version = "=0.13.5", default-features = false, features = ["native-tls"] }
dom_query = "=0.28.0"

[dev-dependencies]
tempfile = "3"
