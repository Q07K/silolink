[package]
name = "silolink"
version = "0.1.0-dev.0"
edition = "2024"
rust-version = "1.90"
description = "Connect project knowledge and AI work across coding tools"
publish = false
default-run = "silolink"

[[bin]]
name = "silolink-provider-fixture"
path = "tests/support/provider.rs"
test = false

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
dirs = "6"
dunce = "1"
ignore = "0.4"
percent-encoding = "2.3"
pulldown-cmark = { version = "0.13", default-features = false }
rusqlite = { version = "0.41.1", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
sha2 = "0.10"
tokio = { version = "1", features = ["rt", "macros", "process", "io-util", "time", "signal", "sync"] }
uuid = { version = "1", features = ["v4"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Threading"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
tempfile = "3"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
